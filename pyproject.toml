[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "failsafe"
version = "0.1.0"
description = "Turn AI-agent failures into repeatable regression tests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
failsafe = "failsafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]